# Railway deployment config — Next360 API
# Deploy: https://railway.com/new/github (choose this repo) — the Dockerfile is auto-detected.
# Then add a Redis plugin and the env vars from apps/api/.env.production.example.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
